<section class="flex flex-col px-4 py-10 sm:px-8 lg:px-16">
  <div class="order-1 mx-auto grid max-w-6xl lg:order-2 lg:grid-cols-2">
    <div class="order-2 mx-auto flex w-[90%] md:w-[80%] flex-col gap-4 lg:order-1">
      <img [src]="selectedImage" [alt]="productName" class="aspect-square w-full rounded-[40px] object-cover" />

      <div class="grid w-full grid-cols-4 gap-3">
        <button *ngFor="let img of images" (click)="selectedImage = img"
          class="aspect-square w-full overflow-hidden rounded-xl border-2 transition"
          [class.border-[var(--color-accent)]]="selectedImage === img"
          [class.border-transparent]="selectedImage !== img">
          <img [src]="img" [alt]="productName" class="h-full w-full object-cover" />
        </button>
      </div>
    </div>

    <div class="order-1 mb-[40px] text-center text-[var(--color-text-dark)] lg:order-2 lg:text-left">
      <h1 class="mt-4 mb-1 text-[32px] font-semibold"> {{ productName }}</h1>

      <div class="mb-5 flex items-center justify-center gap-4 md:mb-10 lg:justify-start">
        <span class="text-[24px] font-semibold">{{ productPrice }}</span>
      </div>

      <div class="flex flex-col items-center gap-4 lg:items-start">
        <button (click)="addToCart()" class="primary-button mx-auto block min-w-40 lg:mx-0">Add to Cart</button>
        <p *ngIf="addToCartMessage" class="text-sm font-medium text-[var(--color-text-dark)]">
          {{ addToCartMessage }}
        </p>
      </div>
    </div>
  </div>

  <app-request-dialog (submitted)="onRequestSubmitted($event)" />
</section>
