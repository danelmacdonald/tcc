<dialog #requestDialog class="rounded-2xl overflow-hidden bg-white backdrop:bg-black/50 w-[90%]
  max-w-md m-auto p-0">
  <div class="flex flex-col">

    <h2 class="text-xl font-medium text-[var(--color-text-dark)] bg-[var(--color-primary)] p-[20px]">
      Submit a Request
    </h2>

    <button (click)="close()"
      class="absolute top-[20px] right-[20px] text-[var(--color-text-dark)] hover:text-black cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[24px] h-[24px]">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>

    <form (ngSubmit)="onSubmit()" #requestForm="ngForm" class="flex flex-col gap-4 p-[20px]">
      <label class="block">
        <span class="mb-2 block font-medium text-[var(--color-text-dark)]">First name</span>
        <input [(ngModel)]="firstName" name="firstName" type="text" placeholder="First name"
          class="rounded-lg outline-none resize-none input w-full" required />
      </label>
      <label class="block">
        <span class="mb-2 block font-medium text-[var(--color-text-dark)]">Surname</span>
        <input [(ngModel)]="surname" name="surname" type="text" placeholder="Surname"
          class="rounded-lg p-3 outline-none resize-none input w-full" required />
      </label>
      <label class="block">
        <span class="mb-2 block font-medium text-[var(--color-text-dark)]">Email</span>
        <input [(ngModel)]="email" name="email" type="email" placeholder="Email"
          class="rounded-lg p-3 outline-none resize-none input w-full" required />
      </label>
      <label class="block">
        <span class="mb-2 block font-medium text-[var(--color-text-dark)]">Request details</span>
        <textarea [(ngModel)]="requestText" name="requestText" placeholder="Describe what you're looking for..." rows="8"
          class="rounded-lg p-3 outline-none resize-none input w-full" required></textarea>
      </label>

      @if (errorMessage) {
      <p class="text-red-500 text-sm">{{ errorMessage }}</p>
      }

      <div class="flex justify-between bg-[var(--color-primary)] p-[20px] -mx-[20px] -mb-[20px] mt-2">
        <button type="button" (click)="close()" class="w-[48%] secondary-button border">Cancel</button>
        <button type="submit" [disabled]="submitting" class="w-[48%] primary-button">
          {{ submitting ? 'Sending...' : 'Submit' }}
        </button>
      </div>
    </form>

  </div>
</dialog>
