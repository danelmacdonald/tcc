<nav class="relative h-[150px] bg-[var(--color-primary)]">
  <div class="mx-auto flex h-full items-center justify-between px-3 md:px-6">
    <a *ngIf="isHomePage" routerLink="/" class="flex items-center lg:absolute lg:left-0 lg:z-10 xl:-top-8">
      <img src="logo/logo-transparent.png" alt="Logo"
        class="object-contain md:h-[150px] w-[150px] h-[150px] md:w-[180px] md:h-[180px] xl:h-[360px] xl:w-[360px]" />
    </a>

    <a *ngIf="!isHomePage" routerLink="/" class="flex items-center">
      <img src="logo/logo-transparent.png" alt="Logo"
        class="h-[150px] w-[150px] object-contain md:h-[180px] md:w-[180px]" />
    </a>

    <div class="ml-auto flex h-full w-full items-center justify-end text-[var(--color-text-dark)]">
      <div class="hidden items-center gap-10 text-[var(--color-text-dark)] lg:flex">
        <a routerLink="/"
          class="font-medium relative cursor-pointer text-2xl after:absolute after:bottom-0 after:left-0 after:h-1 after:w-0 after:bg-[var(--color-text-dark)] after:transition-all after:duration-300 hover:after:w-full">
          Shop
        </a>
        <button (click)="openContactDialog()"
          class="font-medium relative cursor-pointer text-2xl after:absolute after:bottom-0 after:left-0 after:h-1 after:w-0 after:bg-[var(--color-text-dark)] after:transition-all after:duration-300 hover:after:w-full">
          Contact
        </button>
        <a routerLink="/delivery"
          class="font-medium relative text-2xl cursor-pointer after:bg-[var(--color-text-dark)] after:absolute after:h-1 after:w-0 after:bottom-0 after:left-0 hover:after:w-full after:transition-all after:duration-300">Delivery</a>
      </div>

      <div class="hidden lg:flex w-20"></div>

      <div class="flex items-center gap-6 text-[var(--color-text-dark)] md:gap-10">
        <a routerLink="/checkout" class="relative block">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"
            class="h-[30px] w-[30px] cursor-pointer text-[var(--color-text-dark)] hover:text-black md:h-[40px] md:w-[40px]">
            <circle cx="8" cy="21" r="1" />
            <circle cx="19" cy="21" r="1" />
            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
          </svg>
          <span *ngIf="cartService.itemCount() > 0"
            class="absolute -right-2 -top-2 flex h-5 min-w-5 items-center justify-center rounded-full bg-[var(--color-accent)] px-1 text-xs font-semibold text-white">
            {{ cartService.itemCount() }}
          </span>
        </a>
        <button (click)="toggleMobileMenu()" class="mr-4">
          <svg *ngIf="!isMobileMenuOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="w-[30px] h-[30px] md:w-[40px] md:h-[40px] cursor-pointer text-[var(--color-text-dark)] hover:text-black">
            <line x1="4" x2="20" y1="12" y2="12" />
            <line x1="4" x2="20" y1="6" y2="6" />
            <line x1="4" x2="20" y1="18" y2="18" />
          </svg>
          <svg *ngIf="isMobileMenuOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="w-[30px] h-[30px] md:w-[40px] md:h-[40px] cursor-pointer text-[var(--color-text-dark)] hover:text-black">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="isMobileMenuOpen" class="fixed inset-0 z-30">
    <button (click)="toggleMobileMenu()" class="absolute inset-0 bg-black/25" aria-label="Close menu"></button>

    <div
      class="absolute right-4 top-24 w-[min(20rem,calc(100vw-2rem))] rounded-[28px] bg-white p-6 shadow-[0_18px_40px_rgba(52,5,61,0.16)] md:right-6">
      <div class="mb-4 text-right text-sm font-medium uppercase tracking-[0.2em] text-[var(--color-text-light)]">
        Menu
      </div>

      <div class="flex flex-col gap-4 text-right text-2xl text-[var(--color-text-dark)]">
        <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="underline"
          (click)="toggleMobileMenu()">Shop</a>
        <a routerLink="/checkout" routerLinkActive="underline" (click)="toggleMobileMenu()">Checkout</a>
        <button (click)="openContactDialog()" class="text-right">Contact</button>
        <a routerLink="/delivery" routerLinkActive="underline" (click)="toggleMobileMenu()">Delivery</a>
      </div>
    </div>
  </div>

  <app-contact-dialog />
</nav>
